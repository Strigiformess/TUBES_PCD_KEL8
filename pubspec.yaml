name: freshcheck
description: Sistem Analisis Tingkat Kesegaran Makanan Berbasis Computer Vision
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.3
  provider: ^6.1.2
  
  # Navigation
  go_router: ^13.0.0
  
  # Camera & Image
  camera: ^0.10.5+9
  image_picker: ^1.0.0
  image: ^4.1.7
  file_picker: ^10.3.2 
  
  # ML Kit - Image Labeling
  google_mlkit_image_labeling: ^0.10.0
  
  # TFLite - Custom freshness model (native only)
  tflite_flutter: ^0.12.1
  
  # Local Storage (scan history)
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  
  # Utilities
  path_provider: ^2.1.2
  intl: ^0.19.0
  uuid: ^4.3.3
  permission_handler: ^11.3.0
  
  # UI & Design
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/labels/
    - assets/models/fruit_model.tflite
    