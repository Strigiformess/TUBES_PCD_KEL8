name: freshcheck
description: Sistem Analisis Tingkat Kesegaran Makanan Berbasis Computer Vision
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.0
  path_provider: ^2.1.5
  crypto: ^3.0.3 
  provider: ^6.1.2
  mongo_dart: ^0.10.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_dotenv: ^5.1.0
  connectivity_plus: ^6.0.3
  flutter_riverpod: ^2.5.1
  google_fonts: ^6.2.1
  bcrypt: ^1.1.3
  uuid: ^4.4.0
  image: ^4.1.7  
  # provider: ^6.1.5+1
  image_picker: ^1.1.2
  tflite_flutter: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
